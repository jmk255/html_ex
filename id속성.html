<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>id속성</title>
</head>
<body>
  <!--
    요소의 식별자로 사람에게 아이디를 부여하듯 요소에 아이디를 부여하면, 브라우저는 해당 요소를 정확하고 신속하게 식별할 수 있다.

    id속성값은 문서 내에서 유일해야 하며,문자, 숫자, 하이픈(-), 언더스코어(_), 콜론(:), 마침표(.) 등을 사용하여 값을 작성할 수 있다.

    section = 영역을 나눌때 쓰는 요소

    class = 그룹 개념으로 여러개의 요소를 하나의 이름으로 묶는 것
  -->
    <section id="main">
      <section id="overview">개요 영역</section>
      <section id="index" class="element">목차 영역</section>
      <section id="picture" class="element">그림 영역</section>
      <section id="comment" class="element">댓글 영역</section>
    </section>
</body>
</html>
