<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>textarea요소</title>
</head>
<body>
  <!--
    텍스트 영역을 표시한다.

    - Maxlength 속성 : 사용자가 입력할 수 있는 최대 글자 수 지정
    - Wrap 속성 : 줄바꿈을 지정한다.
    
    wrap = "off" : 줄바꿈이 이루어 지지 않는다.(대신 스크롤 바가 생긴다.)
    
    soft : 입력할 때는 한 행을 다 채우면 줄바꿈이 되지만 전송 시에는 줄바꿈이 일어나지 않는다.
    
    hard : 줄바꿈이 적용된 상태로 전송한다.
  -->

    <form>
      <textarea placeholder="댓글을 입력해 주세요!" wrap="off"></textarea>
      <p>
        <input type="submit" value="등록">
      </p>
    </form>

    <!--select요소 : 선택 컨트롤을 표시-->
    <select>
      <option>김밥</option>
      <option>떡볶이</option>
      <option selected>어묵</option>
      <option>순대</option>
    </select>
</body>
</html>
