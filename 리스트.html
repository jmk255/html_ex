<!DOCTYPE html>
<html lang="en">

<head>

  <title>리스트</title>

<body>

    ol요소 : 순서가 있는 리스트
    li요소 : li요소는 리스트 자체가 아니라 리스트를 구성하는 항목입니다,
             부모인 ol, ul요소와 함께 사용해야 한다
  -->

    <li>포도</li>

    ul : 순서가 없는 리스트
  -->

</html>
