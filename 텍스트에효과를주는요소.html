<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>텍스트에 다양한 효과를 주는 요소</title>
</head>
<body>
  <!--
    b태그 : 단순히 화면의 텍스트를 굵게 표현
    strong태그 : 텍스트를 굵게 표현해줄 뿐만 아니라 그내용이 중요하다는 의미도 포함
  -->
  <p>
    <b>"이 부분"</b>은 단순히 글씨가 굵은 부분입니다
  </p>
  <p>
    <strong>"이 부분"</strong>은 중요한 부분이라서 굵게 표현합니다
  </p>

  <!--
    i태그 : 단순히 화면의 텍스트를 이탤릭체로 표현
    em태그 : 텍스트를 이탤릭체로 변환해줄 뿐만 아니라 그내용이 중요하다는 의미도 포함
  -->
  <p>
    <i>"이 부분"</i>은 단순히 글씨가 이탤릭체인 부분입니다
  </p>
  <p>
    <em>"이 부분"</em>은 중요한 부분이라서 이탤릭체로 표현합니다
  </p>

  <!--
    sup태그 : 위첨자
    sub태그 : 아래첨자
  -->
  <p>
    X<sup>2</sup> + Y<sub>3</sub> = Z
  </p>
  <p>물을 나타내는 화학식은 H<sub>2</sub>O 입니다</p>

  <!--
    abbr태그: 태그위에 마우스를 위치시키면 title속성에 명시한 용어의 원형이 나타남
  -->
    <p>
      <strong>
        <abbr title="HyperText Markup Laguage 5">HTML5</abbr>
      </strong>
    </p>
</body>
</html>
