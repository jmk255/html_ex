<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form요소</title>
</head>

<body>
  <!--
  - Form 요소 : 폼의 범위를 표시한다.
    
    action 속성 : 실행 애플리케이션(입력된 데이터를 처리하는 서버 또는 프로그램)을 지정한다.
    
    method 속성 : http 메소드를 지정한다. 클라이언트와 서버 간 데이터를 주고받기 위한 방식
    
    전송방식으로 get과 post가 있으며 post방식에 비해 get방식은 전송할 수 있는 데이터가 제한적이다.(기본값은 “get”)
    
    name 속성 : 폼 이름을 지정한다.
    

- Fieldset 요소 : 폼 내에서 관련 컨트롤을 그룹으로 묶을 때 사용한다.
- Legend요소 : fieldset요소의 제목을 표시한다.
- Input 요소 : 데이터 입력이나 편집을 위한 컨트롤이 위치하는 곳이다.

input요소의 type속성
- button : 버튼생성(푸시 버튼으로 기본 기능이 없다.)
- checkbox : 체크박스 생성
- file : 파일입력 양식 생성(파일 업로드 컨트롤 - 실제 업로드는 전송 버튼에 의해 이루어진다.)
- hidden : 보이지 않는다.
- image : 이미지 형태 생성
- password : 비밀번호 입력 양식 생성
- radio : 라디오 버튼 생성
- reset : 초기화 버튼 생성(form에 입력한 양식을 초기화)
- submit : 제출 버튼 생성(action속성에 입력된 경로로 입력한 데이터를 전송한다.)
- text : 글자 입력 양식 생성
- date : 일 선택 양식 생성
- datetime : 날짜 선택 양식 생성
- month : 월 선택 양식
- week : 주 선택 양식
- time : 시간 선택 양식
- number : 숫자 생성 양식
- email :  이메일 입력 양식 생성
- tel : 전화번호 입력 양식
- url : url주소 입력 양식
- color : 색상 선택 양식 생성
- range : 범위 선택 양식
- search : 검색어 입력 양식
  -->

  <form action="입력된 데이터를 처리하는 서버 또는 프로그램 경로">
    <fieldset>
      <legend>입력 양식</legend>
      이름 : 
      <input type="text" name="user"> <br>
      이메일 : 
      <input type="email" name="email"><br>
      <input type="submit" value="전송">
    </fieldset>
  </form>
</body>

</html>
