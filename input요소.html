<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input요소</title>
</head>
<body>
  <!--
    autopocus : 해당 요소가 문서 로딩과 동시에 포커스를 받는다
    required : 필수 입력필드를 지정
    multiple : 다중 입력을 지정
    step : 입력값의 단계를 지정
    placeholder : 텍스트 필드 내에 짧은 도움말을 지정
    readonly : 읽기전용 상태로 지정(text와 password에서만 사용할 수 있다)
    tabindex : 탭 키를 이용하여 문서를 돌아 다닐때 순서를 지정
  -->
  <form>
    <input type="text" required tabindex="2"><br>
    <input type="file" multiple name="file_select" tabindex="-1"><br>
    <input type="number" step="5" placeholder="숫자만 입력하세요" tabindex="1"><br>
    <input type="checkbox" checked tabindex="3"><br>
    <input type="text" readonly value="readonly" tabindex="0"><br>

    <input type="submit" tabindex="-1">
    <!--
      tabindex 값은 1부터 순서대로 포커스 되고 0을 맨 마지막에 포커싱 해준다.
      값을 “-1”로 지정하면 포커스가 생기지 않는다.
    -->
  </form>
  <form>
    <!--
      label요소 : 항목이나 파일을 식별하기 위해 사용되는 제목이나 이름
      
      label의 for속성과 input요소의 id 값을 동일하게 설정하고 label요소를 클릭하면 자동으로 input태그에 초점이 맞추어 진다.
    -->
    <label for="name">이름</label><br>
    <input type="text" name="name" id="name">
    <br>
    <label>
      이름 <br>
      <input type="text" name="name" id="name2">
    </label>
    
  </form>
</body>
</html>
