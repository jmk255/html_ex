<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지태그</title>
</head>
<body>
  <!--
    이미지 태그 : img
    src : 이미지의 경로 정보(source)
    alt : 대체문자 - 이미지가 보이지 않을때 문자로 이미지 정보를 전달

    <img src="이미지 경로" alt="대체문자"> => 닫는 태그가 없음
  -->
    <img src="images/bookstore.png" alt="북스토어 링크 이미지">
</body>
</html>
