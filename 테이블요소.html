<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테이블요소</title>
</head>
<body>
  <!--
    - table 태그 -> 웹사이트 표를 만들 때 사용
    - tr = table row
    - th = table head(부수적인 정보를 표현할 때)
    - td = table data(메인데이터)
  -->
  <table border="1">
    <tr>
      <th>교시/요일</th>
      <th>월</th>
      <th>화</th>
      <th>수</th>
    </tr>
    <tr>
      <th>1교시</th>
      <td>국어</td>
      <td>수학</td>
      <td>영어</td>
    </tr>
    <tr>
      <th>2교시</th>
      <td>국사</td>
      <td>음악</td>
      <td>체육</td>
    </tr>
  </table>
  <!--웹 접근성에 관련된 내용으로 table자식으로 tr이 올 수 없다 thead 또는 tbody가 자식으로 오게 된다.-->
  <br>
  <!--
    colspan = 가로 셀 병합
    rowspan = 세로 셀 병합
  -->
  <table border="1">
    <tr>
      <th rowspan="2">구분</th>
      <th colspan="2">1학년</th>
      <th colspan="2">2학년</th>
    </tr>
    <tr>
      <th>홍길동</th>
      <th>황정훈</th>
      <th>신경현</th>
      <th>용은비</th>
    </tr>
    <tr>
      <th>전공필수</th>
      <td>100</td>
      <td>90</td>
      <td>80</td>
      <td>70</td>
    </tr>
    <tr>
      <th>전공선택</th>
      <td>60</td>
      <td>50</td>
      <td>40</td>
    </tr>
  </table>
</body>
</html>
