<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제목과 단락</title>
</head>
<body>
  <!--h요소는 가장 큰 <h1>태그부터 가장 작은 <h6>태그까지 다양한 크기로 제목을 표현할 수 있습니다-->
  <h1>웹 페이지 제목</h1>
  <h2>서브 제목</h2>
  <h3>더 작은 서브 제목</h3>

  <!--
  단락이란 내용상 끊어서 구분할 수 있는 하나하나의 부분을 의미하며, 문단이라고도 부릅니다.

  br = 개행(줄바꿈)태그 => 싱글클로징 태그(닫는 태그가 없다)
  -->
  <p>
    이 문단은 웹 페이지의 주요 내용을 담고 있습니다.<br>
    HTML에서는 P태그를 사용하여 텍스트를 단락으로 구분합니다.
  </p>
</body>
</html>
