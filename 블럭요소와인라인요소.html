<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블럭 요소와 인라인 요소</title>
</head>
<body>
  <!--
  구역(영역)을 나눌때 사용하는 태그
    div(division) = 블럭요소 
    span = 인라인요소
  -->
  <div style="border:1px solid red;">블럭요소</div>
  <div style="border:1px solid red;">블럭요소</div>
  <span style="border:1px solid red;">인라인요소</span>
  <span style="border:1px solid red;">인라인요소</span>

  <span style="width:200px; height:300px; background-color:blue;">인라인 요소</span>
</body>
</html>
